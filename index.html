<!DOCTYPE html>
<html>
<head>
    <title>Foodie - Food Delivery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🍴 Foodie</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#menu">Menu</a>
            <a href="#cart">Cart 🛒 (<span id="cartCount">0</span>)</a>
        </nav>
    </header>

    <section id="home" class="hero">
        <h2>Delicious Food Delivered Fast 🚚</h2>
        <p>Order your favourite food from Foodie!</p>
        <button onclick="location.href='#menu'">Order Now</button>
    </section>

    <section id="menu">
        <h2>Our Menu</h2>

        <div class="food-container">

            <div class="food-card">
                <h3>🍕 Pizza</h3>
                <p>Cheese Pizza</p>
                <h4>₹199</h4>
                <button onclick="addToCart('Pizza', 199)">Add to Cart</button>
            </div>

            <div class="food-card">
                <h3>🍔 Burger</h3>
                <p>Chicken Burger</p>
                <h4>₹149</h4>
                <button onclick="addToCart('Burger', 149)">Add to Cart</button>
            </div>

            <div class="food-card">
                <h3>🍝 Pasta</h3>
                <p>Creamy Pasta</p>
                <h4>₹179</h4>
                <button onclick="addToCart('Pasta', 179)">Add to Cart</button>
            </div>

            <div class="food-card">
                <h3>🍚 Biryani</h3>
                <p>Chicken Biryani</p>
                <h4>₹229</h4>
                <button onclick="addToCart('Biryani', 229)">Add to Cart</button>
            </div>

        </div>
    </section>

    <section id="cart">
        <h2>🛒 Your Cart</h2>

        <div id="cartItems">
            <p>Your cart is empty.</p>
        </div>

        <h3>Total: ₹<span id="total">0</span></h3>

        <button class="order-btn" onclick="placeOrder()">
            Place Order
        </button>
    </section>

    <script src="script.js"></script>
</body>
</html>
